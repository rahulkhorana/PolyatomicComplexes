name: ci

on:
  push:
    branches: [main, productionizing]
  workflow_dispatch:

jobs:
  test:
    name: test (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        shard_total: [8]
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]

    env:
      PYTHONOPTIMIZE: "0"
      PYTEST_ADDOPTS: "--log-level=WARNING"

    steps:
      - name: Checkout code with LFS (Full Clone)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0 # <--- THIS IS THE KEY. Fetches the entire git history.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements/requirements.txt

      - name: Discover and shard all test files
        id: shard_files
        run: |
          # The working directory is important if your tests aren't at the root.
          find ./polyatomic_complexes -type f -name "test_*.py" | sort > all_test_files.txt
          
          echo "Total test files found: $(wc -l < all_test_files.txt)"
          
          awk "NR % ${{ matrix.shard_total }} == ${{ matrix.shard_index }}" all_test_files.txt > shard_files.txt
          
          echo "Shard $((${{ matrix.shard_index }} + 1))/${{ matrix.shard_total }} will run $(wc -l < shard_files.txt) file(s)."
          
          if [ -s shard_files.txt ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests for this shard
        if: steps.shard_files.outputs.has_tests == 'true'
        run: |
          # Use xargs for parallel execution within the shard.
          # The "|| [ $? -eq 5 ]" part cleverly ignores the "no tests found" error.
          cat shard_files.txt | xargs python -m pytest -v || [ $? -eq 5 ]

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shard-${{ matrix.shard_index }}
          fail_ci_if_error: false
          verbose: true

  codecov-finalize:
    name: codecov finalize
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
