name: ci

on:
  push:
    branches: [main, productionizing]
  workflow_dispatch:

jobs:
  test:
    name: test (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.11']
        shard_total: [8]
        shard_index: [0,1,2,3,4,5,6,7]

    env:
      PYTHONOPTIMIZE: "0"
      PYTEST_ADDOPTS: "--log-level=WARNING"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python version
        run: python --version

      - name: Pull LFS dataset
        run: |
          git lfs pull --include=polyatomic_complexes/dataset/**/*.csv
          git lfs pull --include=polyatomic_complexes/dataset/**/*.json
          git lfs pull --include=polyatomic_complexes/dataset/**/atom_lookup.pkl

      - name: Install dependencies
        run: |
          pip install -r requirements/requirements.txt

      - name: Collect static test nodeids (no imports, no OOM)
        working-directory: ./polyatomic_complexes
        run: |
          echo "Generating static test list..."
          find . -type f -name "test_*.py" | sort > all_test_files.txt

          > all_nodeids.txt
          while read file; do
            while read -r line; do
              if [[ $line =~ ^def\ (test_[a-zA-Z0-9_]+) ]]; then
                test_name="${BASH_REMATCH[1]}"
                echo "${file#./}::${test_name}" >> all_nodeids.txt
              fi
            done < "$file"
          done < all_test_files.txt

          echo "Total tests found:"
          wc -l all_nodeids.txt

      - name: Shard test nodeids
        working-directory: ./polyatomic_complexes
        run: |
          TOTAL=${{ matrix.shard_total }}
          INDEX=${{ matrix.shard_index }}

          awk "NR % $TOTAL == $INDEX" all_nodeids.txt > shard.txt

          echo "Shard $INDEX/$TOTAL will run $(wc -l < shard.txt) test(s)."
          cat shard.txt || echo "No tests assigned."

      - name: Run this shard
        working-directory: ./polyatomic_complexes
        run: |
          if [ -s shard.txt ]; then
            split -l 100 shard.txt batch_
            for f in batch_*; do
              echo "Running batch $f:"
              python -B -m pytest -v --maxfail=1 $(cat "$f") || exit 1
            done
          else
            echo "No tests to run in this shard."
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shard-${{ matrix.shard_index }}
          name: shard-${{ matrix.shard_index }}
          partial: true
          fail_ci_if_error: false
          verbose: true

  codecov-finalize:
    name: codecov finalize
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          finalize: true
          fail_ci_if_error: false
          verbose: true
