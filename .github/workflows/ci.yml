name: ci
on:
  push:
    branches: [main, productionizing]
  workflow_dispatch:

jobs:
  test-shard:
    name: Shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.11']
        shard_total: [4]
        shard_index: [0, 1, 2, 3]
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true  # Enable LFS checkout
      
      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull --include="polyatomic_complexes/dataset/**/*.csv"
          git lfs pull --include="polyatomic_complexes/dataset/**/*.json" 
          git lfs pull --include="polyatomic_complexes/dataset/**/atom_lookup.pkl"
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-
            pip-${{ runner.os }}-
      
      - name: Cache installed packages
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: python-env-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements/requirements.txt') }}
          restore-keys: |
            python-env-${{ runner.os }}-py${{ matrix.python-version }}-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt
      
      - name: Verify environment
        working-directory: ./polyatomic_complexes
        run: |
          echo "Python path:"
          python -c "import sys; print('\n'.join(sys.path))"
          echo -e "\nPython packages:"
          pip list | head -10
          echo -e "\nTest files found:"
          find . -name "test_*.py" | wc -l
      
      - name: Collect test nodeids using file scanning
        working-directory: ./polyatomic_complexes
        run: |
          echo "Collecting test nodeids by scanning files..."
          
          # Simple approach - use Python to generate nodeids
          python3 << 'EOF'
          import os
          import re
          
          nodeids = []
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.startswith('test_') and file.endswith('.py'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r') as f:
                          content = f.read()
                          # Find test functions
                          matches = re.findall(r'^\s*def (test_[a-zA-Z0-9_]+)', content, re.MULTILINE)
                          for match in matches:
                              # Convert to pytest nodeid format
                              rel_path = filepath[2:] if filepath.startswith('./') else filepath
                              nodeid = f"{rel_path}::{match}"
                              nodeids.append(nodeid)
          
          # Write to file
          with open('all_nodeids.txt', 'w') as f:
              for nodeid in sorted(nodeids):
                  f.write(nodeid + '\n')
          
          print(f"Total tests found: {len(nodeids)}")
          EOF
          
          if [ -s all_nodeids.txt ]; then
            echo "First few tests:"
            head -5 all_nodeids.txt
            echo "Last few tests:"
            tail -5 all_nodeids.txt
          else
            echo "No tests found!"
            exit 1
          fi
      
      - name: Split test nodeids into shard
        working-directory: ./polyatomic_complexes
        run: |
          TOTAL=${{ matrix.shard_total }}
          INDEX=${{ matrix.shard_index }}
          
          # Create shard using modulo arithmetic (1-indexed for better distribution)
          awk "NR % $TOTAL == ($INDEX + 1) % $TOTAL" all_nodeids.txt > shard_nodeids.txt
          
          echo "Shard $INDEX will run $(wc -l < shard_nodeids.txt) test(s)."
          if [ -s shard_nodeids.txt ]; then
            echo "First few tests in this shard:"
            head -3 shard_nodeids.txt
          fi
      
      - name: Run tests for shard
        working-directory: ./polyatomic_complexes
        run: |
          if [ -s shard_nodeids.txt ]; then
            echo "Running $(wc -l < shard_nodeids.txt) tests in shard ${{ matrix.shard_index }}"
            
            # Run tests in smaller batches to avoid command line length limits
            split -l 10 shard_nodeids.txt batch_
            
            for batch_file in batch_*; do
              if [ -s "$batch_file" ]; then
                echo "Running batch: $batch_file ($(wc -l < $batch_file) tests)"
                echo "Tests in this batch:"
                cat "$batch_file"
                
                # Convert nodeids to space-separated list and run
                test_list=$(cat "$batch_file" | tr '\n' ' ')
                python -m pytest -v --maxfail=1 --tb=short $test_list
                
                if [ $? -ne 0 ]; then
                  echo "Batch $batch_file failed"
                  exit 1
                fi
                echo "Batch $batch_file completed successfully"
              fi
            done
          else
            echo "No tests to run in this shard."
          fi
      
      - name: Upload coverage reports to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shard-${{ matrix.shard_index }}

  # Combine results from all shards
  test-results:
    needs: test-shard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-shard.result }}" = "success" ]; then
            echo "All test shards passed!"
          else
            echo "Some test shards failed"
            exit 1
          fi
