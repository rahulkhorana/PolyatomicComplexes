name: ci

on:
  push:
    branches:
      - main
      - productionizing
  workflow_dispatch:

jobs:
  test:
    name: test (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11.11']
        shard_total: [8]
        shard_index: [1,2,3,4,5,6,7,8]

    env:
      PYTHONOPTIMIZE: "1"
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      PYTEST_ADDOPTS: "--log-level=WARNING"

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Verify Python version
        run: python --version

      - name: Checkout LFS artifacts
        run: |
          git lfs pull --include=polyatomic_complexes/dataset/**/*.csv
          git lfs pull --include=polyatomic_complexes/dataset/**/*.json
          git lfs pull --include=polyatomic_complexes/dataset/**/atom_lookup.pkl

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt

      - name: Find and shard test files
        working-directory: ./polyatomic_complexes
        run: |
          find . -type f -name "test_*.py" | sort > all_tests.txt
          TOTAL=${{ matrix.shard_total }}
          INDEX=${{ matrix.shard_index }}
          awk "NR % $TOTAL == $INDEX" all_tests.txt > this_shard.txt
          echo "Shard $INDEX/$TOTAL will run $(wc -l < this_shard.txt) files"

      - name: Run shard
        working-directory: ./polyatomic_complexes
        run: |
          split -l 20 this_shard.txt shard_
          for f in shard_*; do
            echo "=== Running batch $f ==="
            python -B -m pytest -v --maxfail=1 $(cat "$f") || exit 1
          done

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shard-${{ matrix.shard_index }}
          name: shard-${{ matrix.shard_index }}
          partial: true
          fail_ci_if_error: false
          verbose: true

  codecov-finalize:
    name: codecov finalize
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          finalize: true
          fail_ci_if_error: false
          verbose: true
