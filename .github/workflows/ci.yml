name: ci

on:
  push:
    branches: [main, productionizing]
  workflow_dispatch:

jobs:
  test:
    # <--- FIXED: Removed the '+ 1' which is invalid syntax in the name expression.
    # The UI will show shards starting from 0 (e.g., shard 0/8).
    name: test (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        shard_total: [8]
        # <--- FIXED: Reverted to the explicit list. The range() function does not exist.
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]

    env:
      PYTHONOPTIMIZE: "0"
      PYTEST_ADDOPTS: "--log-level=WARNING"

    steps:
      - name: Checkout code with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements/requirements.txt

      - name: Collect and shard tests
        id: collect_tests
        working-directory: ./polyatomic_complexes
        run: |
          pytest --collect-only -q > all_nodeids.txt
          
          echo "Total tests found: $(wc -l < all_nodeids.txt)"

          awk "NR % ${{ matrix.shard_total }} == ${{ matrix.shard_index }}" all_nodeids.txt > shard.txt

          # <--- FIXED: Use shell arithmetic for logging the 1-based index.
          echo "Shard $((${{ matrix.shard_index }} + 1))/${{ matrix.shard_total }} will run $(wc -l < shard.txt) test(s)."
          
          if [ -s shard.txt ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run this shard's tests
        if: steps.collect_tests.outputs.has_tests == 'true'
        working-directory: ./polyatomic_complexes
        run: cat shard.txt | xargs python -m pytest -v

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shard-${{ matrix.shard_index }}
          fail_ci_if_error: false
          verbose: true

  codecov-finalize:
    name: codecov finalize
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
