name: ci

on:
  push:
    branches: [main, productionizing]
  workflow_dispatch:

jobs:
  test-shard:
    name: Shard ${{ matrix.shard_index }}/${{ matrix.shard_total }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.11']
        shard_total: [4]
        shard_index: [0,1,2,3]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements/requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install dependencies
        run: |
          pip install -r requirements/requirements.txt

      - name: Collect test nodeids (static scan)
        working-directory: ./polyatomic_complexes
        run: |
          echo "Collecting test nodeids from source..."
          > all_nodeids.txt
          for file in $(find . -type f -name "test_*.py" | sort); do
            grep -E '^def test_' "$file" | sed -E "s/^def (test_[a-zA-Z0-9_]+).*/${file#./}::\1/" >> all_nodeids.txt
          done
          echo "Total tests found: $(wc -l < all_nodeids.txt)"

      - name: Split test nodeids into shard
        working-directory: ./polyatomic_complexes
        run: |
          TOTAL=${{ matrix.shard_total }}
          INDEX=${{ matrix.shard_index }}
          awk "NR % $TOTAL == $INDEX" all_nodeids.txt > shard_nodeids.txt
          echo "Shard $INDEX will run $(wc -l < shard_nodeids.txt) test(s)."
          cat shard_nodeids.txt

      - name: Run tests for shard
        working-directory: ./polyatomic_complexes
        run: |
          if [ -s shard_nodeids.txt ]; then
            split -l 50 shard_nodeids.txt batch_
            for f in batch_*; do
              echo "Running batch: $f"
              python -B -m pytest -v --maxfail=1 $(cat $f) || exit 1
            done
          else
            echo "No tests to run in this shard."
