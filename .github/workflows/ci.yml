name: ci

on:
  push:
    branches: [main, productionizing]
  workflow_dispatch:

jobs:
  test:
    name: test (shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
        shard_total: [8]
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]

    env:
      PYTHONOPTIMIZE: "0"
      PYTEST_ADDOPTS: "--log-level=WARNING"

    steps:
      - name: Checkout code with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements/requirements.txt

      - name: Discover and shard test files (Low Memory)
        id: shard_files
        run: |
          # Step 1: Find all test files without importing them. This is memory-safe.
          find ./polyatomic_complexes -type f -name "test_*.py" | sort > all_test_files.txt
          
          echo "Total test files found: $(wc -l < all_test_files.txt)"

          # Step 2: Shard the LIST of files using awk.
          awk "NR % ${{ matrix.shard_total }} == ${{ matrix.shard_index }}" all_test_files.txt > shard_files.txt

          echo "Shard $((${{ matrix.shard_index }} + 1))/${{ matrix.shard_total }} will run $(wc -l < shard_files.txt) file(s)."
          
          # Step 3: Set an output to know if this shard has any files to run.
          if [ -s shard_files.txt ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests for this shard
        if: steps.shard_files.outputs.has_tests == 'true'
        run: |
          # Pass the list of files directly to pytest using xargs.
          # Pytest will collect and run tests ONLY from the files in this shard.
          cat shard_files.txt | xargs python -m pytest -v

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: shard-${{ matrix.shard_index }}
          fail_ci_if_error: false
          verbose: true

  codecov-finalize:
    name: codecov finalize
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
